name: Renovar una guía con Agnes

on:
  schedule:
    - cron: '0 19 * * 0'
      timezone: America/Lima
  workflow_dispatch:
    inputs:
      preview:
        description: Generar texto y portada de prueba sin publicarlos
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: guides-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Redactar y generar portada para la guía en turno
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GUIDES_AUTOMATION_TOKEN: ${{ secrets.GUIDES_AUTOMATION_TOKEN }}
          GUIDES_STORE_URL: https://fraganus.link
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [[ -z "$AGNES_API_KEY" || -z "$GUIDES_AUTOMATION_TOKEN" ]]; then
            echo '::notice::Configura AGNES_API_KEY y GUIDES_AUTOMATION_TOKEN para ejecutar la renovación semanal.'
            exit 0
          fi

          npm ci
          if [[ "$PREVIEW" == 'true' ]]; then
            node scripts/refresh-guides.mjs --preview
          else
            node scripts/refresh-guides.mjs
          fi
