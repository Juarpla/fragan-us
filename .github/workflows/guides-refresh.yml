name: Guías editoriales con Agnes

on:
  schedule:
    - cron: '0 19 * * 0'
      timezone: America/Lima
  workflow_dispatch:
    inputs:
      tema:
        description: Tema para preparar un briefing de diseño. Déjalo vacío para la renovación semanal.
        type: string
        required: false
      preview:
        description: Generar texto y portada de prueba sin publicarlos
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: guides-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Preparar briefing o renovar la guía en turno
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GUIDES_AUTOMATION_TOKEN: ${{ secrets.GUIDES_AUTOMATION_TOKEN }}
          GUIDES_STORE_URL: https://fraganus.link
          GUIDES_CONCEPT_TOPIC: ${{ inputs.tema }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [[ -z "$AGNES_API_KEY" ]]; then
            echo '::notice::Configura AGNES_API_KEY para ejecutar el flujo editorial.'
            exit 0
          fi
          if [[ -z "$GUIDES_CONCEPT_TOPIC" && -z "$GUIDES_AUTOMATION_TOKEN" ]]; then
            echo '::notice::Configura GUIDES_AUTOMATION_TOKEN para ejecutar la renovación semanal.'
            exit 0
          fi

          npm ci
          npm run guides:check
          if [[ "$PREVIEW" == 'true' ]]; then
            node scripts/refresh-guides.mjs --preview
          else
            node scripts/refresh-guides.mjs
          fi
