name: Completar fichas de perfumes

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: Mostrar los campos encontrados sin guardar
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: catalog-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Consultar fichas oficiales y completar campos vacíos
        env:
          CATALOG_STORE_URL: https://fragan-us.juarpla.workers.dev
          CATALOG_ENRICHMENT_TOKEN: ${{ secrets.CATALOG_ENRICHMENT_TOKEN }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [[ "$PREVIEW" == 'true' ]]; then
            node scripts/enrich-catalog.mjs --preview
          else
            node scripts/enrich-catalog.mjs
          fi
